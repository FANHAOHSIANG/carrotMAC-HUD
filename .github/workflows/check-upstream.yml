name: Sync official JetLink releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'versions.json'
      - 'scripts/**'
      - 'tests/**'
      - 'v1/**'
      - 'AppAutostart/**'
      - 'overlays/**'
      - '.github/workflows/check-upstream.yml'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'latest syncs the stable release; other refs build a candidate only'
        required: true
        default: latest
        type: string
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: check-official-jetlink-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.report.outputs.ready }}
      sha: ${{ steps.report.outputs.sha }}
      promote: ${{ steps.select.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
      - name: Test compatibility guard
        run: python3 -m unittest discover -s tests -v
      - name: Resolve immutable official release or pinned test source
        id: select
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/resolve_upstream.py
      - name: Prepare official source with HUD patches
        if: steps.select.outputs.prepare == 'true'
        env:
          UPSTREAM_REF: ${{ steps.select.outputs.ref }}
        run: python3 scripts/prepare_upstream.py --ref "$UPSTREAM_REF"
      - name: Record compatibility result
        id: report
        if: steps.select.outputs.prepare == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('upstream-report.json').read_text())
          ready = report['status'] == 'ready'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print(f'ready={str(ready).lower()}', file=f)
              print('sha=' + (report['versions']['jetlink_revision'] if ready else ''), file=f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              print('## ' + ('Candidate ready for build' if ready else 'Update blocked; current version retained'), file=f)
              print(report['message'], file=f)
          PY
      - name: Package candidate source
        if: steps.report.outputs.ready == 'true'
        run: tar -czf candidate-source.tar.gz candidate-jetlink candidate-versions.json upstream-selection.json
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-report
          path: |
            upstream-report.json
            upstream-selection.json
      - uses: actions/upload-artifact@v4
        if: steps.report.outputs.ready == 'true'
        with:
          name: candidate-source
          path: candidate-source.tar.gz

  build:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source
      - run: tar -xzf candidate-source.tar.gz
      - name: Select Xcode 26.6 and install xcodegen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          brew install xcodegen
      - name: Verify HUD Swift tests on Apple Silicon target
        env:
          CARROT_HUD_DIR: ${{ runner.temp }}/carrot-hud-tests
        run: |
          swift test --package-path candidate-jetlink/JetlinkKit --arch arm64 --filter CarrotHUDTests
      - name: Verify protocol-3 queued and stateful model inference
        run: |
          swift test --package-path candidate-jetlink/JetlinkKit --arch arm64 --filter ProtocolTests
          swift test --package-path candidate-jetlink/JetlinkKit --arch arm64 --filter 'ServerTests/'
          swift test --package-path candidate-jetlink/JetlinkKit --arch arm64 --filter ServerHooksTests
      - name: Build and verify App
        run: |
          JETLINK_VERSION="$(python3 -c 'import json;print(json.load(open("candidate-versions.json"))["jetlink_version"])')" make -C candidate-jetlink/macos app
          codesign --verify --deep --strict candidate-jetlink/macos/build/Jetlink.app
          ditto -c -k --sequesterRsrc --keepParent candidate-jetlink/macos/build/Jetlink.app Jetlink-HUD-candidate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jetlink-HUD-candidate
          path: |
            Jetlink-HUD-candidate.zip
            candidate-versions.json
            upstream-selection.json

  sync-main:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.promote == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Jetlink-HUD-candidate
      - name: Promote only the tested release, retaining HUD and C4 pairing
        env:
          TESTED_SHA: ${{ needs.prepare.outputs.sha }}
          EXPECTED_BASE: ${{ github.sha }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_BASE" ]]; then
            echo 'Main changed during validation; retain it and retry on the next check.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/sync_versions.py
          if git diff --quiet -- versions.json; then
            echo 'Already synchronized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add versions.json
          git commit -m "Sync tested official JetLink release $TESTED_SHA"
          # Fast-forward only. A later concurrent edit rejects this push.
          git push origin HEAD:refs/heads/main
          echo "Updated main to tested JetLink $TESTED_SHA. Run 03-Update.command on the Mac to install." >> "$GITHUB_STEP_SUMMARY"
