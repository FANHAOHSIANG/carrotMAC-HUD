name: Mac HUD Amap exit overlay compatibility
on:
  pull_request:
    paths: ['overlays/protocol3/carrot-hud-amap-exit.patch','scripts/update_hud_locale.py','scripts/check_amap_exit_display.py','.github/workflows/check-amap-exit-display.yml']
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pycapnp==2.1.0
      - name: Apply real overlay on pinned Mac HUD helper and verify legacy compatibility
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          git init /tmp/carrot
          git -C /tmp/carrot fetch --depth 1 https://github.com/ajouatom/openpilot.git a564ce1dc082909b1fdc73b72e64d920336b34d6
          git -C /tmp/carrot checkout --detach FETCH_HEAD
          git -C /tmp/carrot apply "$root/v1/carrot-mac-helper.patch"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from update_hud_locale import apply_hud_patches
          p=Path.cwd()/"overlays/protocol3"
          patches=tuple(p/name for name in ("carrot-hud-zh-tw.patch","carrot-hud-gear.patch","carrot-hud-nav-clock.patch","carrot-hud-amap-exit.patch","carrot-hud-nav-alerts.patch","carrot-hud-alert-placement.patch"))
          apply_hud_patches(Path("/tmp/carrot"), patches, False)
          PY
          python scripts/check_amap_exit_display.py /tmp/carrot
          python -m py_compile /tmp/carrot/tools/jetlink/hud.py /tmp/carrot/openpilot/selfdrive/carrot/cluster/cluster_renderer.py
