name: Mac Vision HUD integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'MacVision/**'
      - 'overlays/**'
      - 'scripts/update_hud_locale.py'
      - 'tests/test_hud_display_update.py'
      - '.github/workflows/check-mac-vision.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pycapnp==2.1.0
      - name: Mac Vision unit tests
        run: python -m unittest discover -s MacVision -v
      - name: Check actual combined helper installation and removal
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          git init /tmp/carrot
          git -C /tmp/carrot fetch --depth 1 https://github.com/ajouatom/openpilot.git a564ce1dc082909b1fdc73b72e64d920336b34d6
          git -C /tmp/carrot checkout --detach FETCH_HEAD
          git -C /tmp/carrot apply "$root/v1/carrot-mac-helper.patch"
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from update_hud_locale import apply_hud_patches
          p=Path.cwd()/"overlays/protocol3"
          patches=tuple(p/name for name in ("carrot-hud-zh-tw.patch","carrot-hud-gear.patch","carrot-hud-nav-clock.patch","carrot-hud-amap-exit.patch","carrot-hud-nav-alerts.patch","carrot-hud-alert-placement.patch","carrot-hud-readable-nav.patch","carrot-hud-nav-text-route.patch","carrot-hud-mode7-map.patch","carrot-hud-alert-positions.patch","carrot-hud-cluster-speed-limit.patch"))
          apply_hud_patches(Path("/tmp/carrot"), patches, False)
          PY
          python scripts/check_amap_exit_display.py /tmp/carrot
          dest=/tmp/carrot/openpilot/selfdrive/carrot/cluster
          cp -r "$dest" /tmp/cluster-before
          python MacVision/install.py "$dest"
          python MacVision/install.py "$dest"
          python -m compileall -q "$dest"
          grep -F 'draw_lamps(scene.vehicles[0], brake, left, right)' "$dest/cluster_renderer.py"
          grep -F 'navi.amap_exit_name' "$dest/cluster_renderer.py"
          python MacVision/install.py "$dest" --remove
          for f in cluster_models.py cluster_live.py cluster_renderer.py cluster_scene.py cluster_route_replay.py; do cmp "/tmp/cluster-before/$f" "$dest/$f"; done
