name: Alpamayo MLX offline contract tests

on:
  push:
    branches: ['test/alpamayo2-edge-mlx-offline-20261128']
    paths:
      - 'tools/alpamayo-mlx/**'
      - '.github/workflows/alpamayo-mlx-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m compileall -q tools/alpamayo-mlx
      - run: python -m unittest discover -s tools/alpamayo-mlx -p 'test_*.py' -v
      - run: bash -n tools/alpamayo-mlx/Run-Alpamayo-Offline.command
